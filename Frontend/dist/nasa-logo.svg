  <!-- Red Chevron / Vector Wing -->
  <path d="M 230 670 L 630 190 L 760 380 L 530 450 L 970 330 L 590 590 Z" fill="#FC3D21" clip-path="url(#circle-clip)" />

  <!-- NASA Lettering -->
  <g fill="#FFFFFF" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="285" letter-spacing="-10">
    <text x="600" y="590" text-anchor="middle">NASA</text>
  </g>
