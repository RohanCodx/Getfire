    </clipPath>
  </defs>
  <!-- Blue Sphere -->
  <circle cx="600" cy="492.5" r="460" fill="#0B3D91" />
  
  <!-- Stars -->
  <g fill="#FFFFFF" clip-path="url(#circle-clip)">
    <circle cx="280" cy="220" r="4.5" />
    <circle cx="340" cy="280" r="3" />
    <circle cx="420" cy="180" r="6" />
    <circle cx="510" cy="250" r="3.5" />
    <circle cx="700" cy="200" r="5" />
    <circle cx="780" cy="260" r="3.5" />
    <circle cx="850" cy="190" r="4" />
    <circle cx="920" cy="290" r="5" />
    <circle cx="250" cy="400" r="4" />
    <circle cx="310" cy="480" r="3.5" />
    <circle cx="380" cy="380" r="5.5" />
    <circle cx="820" cy="420" r="3.5" />
    <circle cx="890" cy="460" r="5" />
    <circle cx="960" cy="390" r="4" />
    <circle cx="290" cy="620" r="5" />
    <circle cx="370" cy="690" r="3.5" />
    <circle cx="440" cy="610" r="4" />
    <circle cx="760" cy="650" r="4" />
    <circle cx="830" cy="720" r="5" />
    <circle cx="910" cy="630" r="3.5" />
